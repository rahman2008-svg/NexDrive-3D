workflows:
  unity-android-apk:
    name: NexDrive 3D - Unity Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      unity: 2022.3.62f2
      groups:
        - unity_credentials
      vars:
        UNITY_VERSION: "2022.3.62f2"
        UNITY_LICENSE: $UNITY_LICENSE

    scripts:
      - name: Verify Unity installation
        script: |
          set -e

          if [ -x "/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity" ]; then
            export UNITY_BIN="/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity"
          elif command -v unity-editor >/dev/null 2>&1; then
            export UNITY_BIN="$(command -v unity-editor)"
          else
            echo "Unity Editor ${UNITY_VERSION} is unavailable."
            exit 1
          fi

          "$UNITY_BIN" -version
          echo "UNITY_BIN=$UNITY_BIN" >> "$CM_ENV"

      - name: Build Android APK
        script: |
          set -e

          mkdir -p "$CM_BUILD_DIR/build"

          "$UNITY_BIN" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$CM_BUILD_DIR" \
            -executeMethod NexDriveBuild.BuildAndroid \
            -logFile "$CM_BUILD_DIR/unity-build.log"

          test -f "$CM_BUILD_DIR/build/NexDrive3D.apk"

    artifacts:
      - build/NexDrive3D.apk
      - unity-build.log
